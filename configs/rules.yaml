
# AI Invoice Auditor - Validation Rules

required_fields:
  header:
    - invoice_number
    - invoice_date
    - vendor_id
    - currency
    - total_amount

  line_item:
    - item_code
    - description
    - quantity
    - unit_price
    - line_total

data_types:
  invoice_number: str
  invoice_date: date
  vendor_id: str
  currency: str
  total_amount: float
  subtotal: float
  tax: float
  quantity: float
  unit_price: float
  line_total: float

tolerances:
  price_difference_percent: 5
  quantity_difference_percent: 0
  tax_difference_percent: 2

accepted_currencies:
  - USD
  - EUR
  - INR
  - GBP

currency_symbol_map:
  "$": USD
  "€": EUR
  "₹": INR
  "£": GBP

validation_policies:
  missing_field_action: flag
  total_mismatch_action: manual_review
  invalid_currency_action: reject
  auto_approve_confidence_threshold: 0.95

reporting:
  include_translation_confidence: true
  include_discrepancy_summary: true
  report_format: HTML
  output_dir: "./outputs/reports"

logging:
  enable_audit_log: true
  log_file: "./logs/invoice_auditor.log"
  log_level: INFO
